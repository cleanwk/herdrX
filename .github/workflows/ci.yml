name: Build and test
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Tools/Tailcat/go.mod
          cache-dependency-path: Tools/Tailcat/go.sum
      - run: brew install xcodegen
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: scripts/test-coexistence.sh
      - run: python3 scripts/herdr-integration-fixture.py build/coexistence-tests/herdr
      - run: scripts/test-panes.sh
      - run: scripts/test-selection.sh
      - run: scripts/build.sh
      - run: scripts/test-pty.sh
      - run: scripts/test-tabs.sh
      - run: scripts/test-inputs.sh
      - run: scripts/package.sh
      - run: python3 scripts/check-delta-updates.py
      - uses: actions/upload-artifact@v4
        with:
          name: HerdrX-preview
          path: |
            build/dist/*
            build/tests/*.png
            build/tests/delta-updates.json
            build/tests/layout-origins.json
          retention-days: 14
