name: Build and test
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Tools/Tailcat/go.mod
          cache-dependency-path: Tools/Tailcat/go.sum
      - run: brew install xcodegen
      - run: scripts/test-tabs.sh
      - run: curl -fsSL https://github.com/herdrdev/herdr/releases/download/v0.9.3/herdr-macos-aarch64 -o /tmp/herdr && chmod +x /tmp/herdr
      - run: scripts/build.sh
      - run: xcrun swiftc scripts/TabDragDriver.swift -o build/tab-drag-driver
      - run: python3 scripts/tab-drag-e2e.py /tmp/herdr build/release/Build/Products/Release/HerdrX.app build/tab-drag-driver
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-drag-probe
          path: build/tests/tab-drag-*
      - run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: HerdrX-preview
          path: |
            build/dist/*
            build/tests/*.png
            build/tests/delta-updates.json
            build/tests/layout-origins.json
            build/tests/pane-actions.json
          retention-days: 14
