name: HerdrX
options:
  deploymentTarget:
    macOS: '14.0'
  xcodeVersion: '27.0'
packages:
  HerdCore:
    path: Core
  Ghostty:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 1.6.20260909
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  HerdrX:
    type: application
    platform: macOS
    sources:
      - App
      - path: Resources/Icon/HerdIcon.icns
        buildPhase: resources
      - path: Resources/Notices.txt
        buildPhase: resources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Build Tailcat Transport
        script: '"${PROJECT_DIR}/scripts/tailcat.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - package: HerdCore
      - package: HerdCore
        product: PTY
      - package: Ghostty
        product: GhosttyTerminal
      - package: Ghostty
        product: GhosttyTheme
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleName: HerdrX
        CFBundleDisplayName: HerdrX
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        CFBundleIconName: AppIcon
        CFBundleIconFile: HerdIcon
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        SUFeedURL: https://github.com/cleanwk/herdrX/releases/latest/download/appcast.xml
        SUPublicEDKey: '$(SPARKLE_PUBLIC_KEY)'
        SUEnableAutomaticChecks: false
    settings:
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.cleanwk.herdrx.dev
          ENABLE_HARDENED_RUNTIME: NO
      base:
        PRODUCT_NAME: HerdrX
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cleanwk.herdrx
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.1.5'
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_IDENTITY: '-'
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: 'arm64 x86_64'
        SPARKLE_PUBLIC_KEY: ''
schemes:
  HerdrX:
    build:
      targets:
        HerdrX: all
    run:
      config: Debug
