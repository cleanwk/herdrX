name: Update HerdrX
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-herdrx
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read latest verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-herdrx.py
      - name: Commit cask if changed
        run: |
          if [[ -f Casks/herdrx.rb ]]; then
            git add Casks/herdrx.rb
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Update HerdrX cask'
              git push
            fi
          fi
